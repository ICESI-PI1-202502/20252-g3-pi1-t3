{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
    <title>{% block title %}Bienestar Universitario{% endblock %}</title>
  
    <link rel="icon" type="image/x-icon" href="{% static 'universitaryWellbeing/img/logo_icesi.png' %}">

    <!-- Favicon still no -->
    <!-- <link rel="icon" href="{% static 'img/favicon.ico' %}">  -->

    <!-- styles -->
    <link rel="stylesheet" href="{% static 'universitaryWellbeing/css/home.css' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
        rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <!-- Header   -->
    {% include 'includes/header.html' %}

    <!-- SIDEBAR -->
    <div id="sidebar" class="sidebar">
        <a href="{% url 'home' %}">Inicio</a>
        <a href="#">FAQ</a>
        <a href="#">Calendario</a>
        <a href="#">¿Quiénes Somos?</a>
        <a href="#">Eventos y Servicios</a>
        <a href="#">Analítica y reportes</a>
        <a href="#">Torneos</a>
        <a href="#">Cerrar sesión</a>
    </div>

    <!-- Fondo oscuro para cerrar -->
    <div id="overlay" class="overlay"></div>


    <main>
        {% block content %}
        <!-- specify content -->
        {% endblock %}
    </main>

    <!-- Footer  -->
    {% include 'includes/footer.html' %}

    <!-- JavaScript for better performance -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/main.js' %}"></script>
</body>

</html>
