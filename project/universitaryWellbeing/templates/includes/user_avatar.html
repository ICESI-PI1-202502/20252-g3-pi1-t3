{# includes/user_avatar.html #}
<div class="user-avatar" title="{{ user.get_full_name|default:user.username }}">
  <span class="user-initials">
    {{ user.first_name|default:user.username|slice:":1"|upper }}
    {% if user.last_name %}{{ user.last_name|slice:":1"|upper }}{% endif %}
  </span>
</div>
